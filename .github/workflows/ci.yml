# Integración continua: cada push compila y prueba las tres partes y, al final,
# levanta todo con Docker Compose y corre la prueba de punta a punta y la de carga.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar, probar y medir cobertura
        run: mvn -B verify
      - name: Reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco
      - name: Resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-backend
          path: backend/target/surefire-reports

  pln:
    name: Servicio PLN (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pln
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pln/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: pytest -q
      - name: Exactitud en el conjunto de validación (RF-02, meta 85 %)
        run: python -m app.evaluar

  datos:
    name: Datos generados al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml bcrypt
      - run: python scripts/generar_datos.py
      - name: nlu.yml y V2__semilla.sql deben coincidir con datos/base_conocimiento.yml
        run: git diff --exit-code -- pln/data/nlu.yml backend/src/main/resources/db/migration/V2__semilla.sql

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    name: Punta a punta (Docker Compose)
    needs: [backend, pln, frontend, datos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el sistema completo
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Prueba E2E
        run: python3 scripts/prueba_e2e.py http://localhost
      - name: Prueba de carga (RNF-05, 100 usuarios concurrentes)
        run: python3 scripts/prueba_carga.py http://localhost 100 3
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Apagar
        if: always()
        run: docker compose down -v
