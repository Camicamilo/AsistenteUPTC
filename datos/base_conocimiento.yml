# =============================================================================
# BASE DE CONOCIMIENTO DEL ASISTENTE VIRTUAL UPTC
# -----------------------------------------------------------------------------
# Fuente única de datos. A partir de este archivo se generan:
#   - pln/data/nlu.yml                                 (entrenamiento del motor PLN, formato Rasa 3)
#   - backend/src/main/resources/db/migration/V2__semilla.sql  (semilla de la base de datos)
# Comando: python scripts/generar_datos.py
#
# IMPORTANTE (RD-01, RD-03, RD-04): los textos, correos y enlaces son de
# DEMOSTRACIÓN. Antes del piloto el enlace institucional debe validarlos o
# reemplazarlos por los oficiales. Las respuestas no inventan fechas ni valores:
# remiten al calendario o a la dependencia que publica el dato oficial.
# =============================================================================

